name: Dual TTS Auto Build
on:
  push:
  workflow_dispatch:
concurrency:
  group: dual-tts-build
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source zip
        run: |
          Z=$(find . -iname 'dual_tts_source.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$Z" ]; then
            echo "ERROR: dual_tts_source.zip not found in the repository"
            exit 1
          fi
          echo "Using $Z"
          rm -rf "$RUNNER_TEMP/src"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q -o "$Z" -d "$RUNNER_TEMP/src"
          S=$(find "$RUNNER_TEMP/src" -name settings.gradle | head -n 1)
          if [ -z "$S" ]; then
            echo "ERROR: settings.gradle not found inside the zip"
            exit 1
          fi
          echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Prepare Android SDK
        run: |
          SM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          echo "sdkmanager: $SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > "$PROJ/local.properties"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build APK
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dual_TTS_App
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
