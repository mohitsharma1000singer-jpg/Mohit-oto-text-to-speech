name: Dual TTS Auto Switch Build
on: {push: null, workflow_dispatch: null}
jobs: {build-apk: {runs-on: ubuntu-latest, steps: [
{name: Checkout, uses: actions/checkout@v4},
{name: Make dirs, run: "mkdir -p app/src/main/java/com/mohit/dualtts app/src/main/res/layout app/src/main/res/values app/src/main/res/xml"},
{name: Write AndroidManifest, run: "echo    | base64 -d -i > app/src/main/AndroidManifest.xml"},
{name: Write strings.xml, run: "echo PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPlBvY2tldCBEdWFsIFRUUzwvc3RyaW5nPgo8L3Jlc291cmNlcz4K | base64 -d -i > app/src/main/res/values/strings.xml"},
{name: Write layout, run: "echo    | base64 -d -i > app/src/main/res/layout/activity_main.xml"},
{name: Write MainActivity, run: "echo         | base64 -d -i > app/src/main/java/com/mohit/dualtts/MainActivity.java"},
{name: Write DualTtsEngineService, run: "echo         | base64 -d -i > app/src/main/java/com/mohit/dualtts/DualTtsEngineService.java"},
{name: Write tts_engine.xml, run: "echo PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHR0cy1lbmdpbmUgeG1sbnM6YW5kcm9pZD0iaHR0cDovL3NjaGVtYXMuYW5kcm9pZC5jb20vYXBrL3Jlcy9hbmRyb2lkIgogICAgYW5kcm9pZDpzZXR0aW5nc0FjdGl2aXR5PSJjb20ubW9oaXQuZHVhbHR0cy5NYWluQWN0aXZpdHkiIC8+Cg== | base64 -d -i > app/src/main/res/xml/tts_engine.xml"},
{name: Write CheckVoiceData, run: "echo  | base64 -d -i > app/src/main/java/com/mohit/dualtts/CheckVoiceData.java"},
{name: Write GetSampleText, run: "echo   | base64 -d -i > app/src/main/java/com/mohit/dualtts/GetSampleText.java"},
{name: Write CrashLogger, run: "echo    | base64 -d -i > app/src/main/java/com/mohit/dualtts/CrashLogger.java"},
{name: Write LogCaptureService, run: "echo    | base64 -d -i > app/src/main/java/com/mohit/dualtts/LogCaptureService.java"},
{name: Write settings.gradle, run: "echo  | base64 -d -i > settings.gradle"},
{name: Write root build.gradle, run: "echo cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMi4wJyBhcHBseSBmYWxzZQp9Cg== | base64 -d -i > build.gradle"},
{name: Write app build.gradle, run: "echo  | base64 -d -i > app/build.gradle"},
{name: Set up JDK 17, uses: actions/setup-java@v4, with: {java-version: 17, distribution: temurin}},
{name: Setup Android SDK, uses: android-actions/setup-android@v3},
{name: Generate Gradle Wrapper, run: "gradle wrapper --gradle-version 8.4 --distribution-type all"},
{name: Setup Gradle, uses: gradle/actions/setup-gradle@v3},
{name: Build APK, run: "./gradlew assembleDebug --no-daemon"},
{name: Upload APK, uses: actions/upload-artifact@v4, with: {name: Dual_TTS_App, path:  app/build/outputs/apk/debug/app-debug.apk}}
]}}
